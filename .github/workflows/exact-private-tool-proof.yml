name: Exact Private THETECHGUY-TOOL Proof

on:
  push:
    branches:
      - proof/qt-offscreen-runner-v1
    paths:
      - .github/workflows/exact-private-tool-proof.yml
      - tools/qt-proof/exact-private-trigger.txt
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/exact-private-tool-proof.yml
      - tools/qt-proof/exact-private-trigger.txt

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  TTG_PRIVATE_REPOSITORY: jaydumisuni/THETECHGUY-TOOL
  TTG_PRIVATE_COMMIT: 3b7397515e18438e16d1747973eb7f055c6f7c76
  REVIEWED_ARTIFACT_ID: "8670582476"
  REVIEWED_ARTIFACT_SHA256: "cf2851e6275fc94d57157a505e173b45b687835d269d10c33281390032b84dc5"

jobs:
  exact-private-proof:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Checkout exact private tool commit
        uses: actions/checkout@v4
        with:
          repository: jaydumisuni/THETECHGUY-TOOL
          ref: 3b7397515e18438e16d1747973eb7f055c6f7c76
          token: ${{ secrets.TTG_CROSS_REPO_TOKEN || secrets.GH_PAT || github.token }}
          path: private-tool
          lfs: false
          persist-credentials: false

      - name: Verify exact private source binding
        shell: pwsh
        run: |
          $actual = (git -C private-tool rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:TTG_PRIVATE_COMMIT.ToLowerInvariant()) {
            throw "Private source binding mismatch."
          }
          "source_commit=$actual" | Set-Content -Encoding utf8 exact-source-binding.txt

      - name: Install exact review dependencies
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check
          "PyQt6>=6.7,<7" "pytest>=8,<9" "cryptography>=42,<46"
          "requests>=2.31,<3" "pyserial>=3.5,<4" "pyusb>=1.2,<2"
          "py7zr>=0.22,<1" "psutil>=5.9,<8" "Pillow>=10,<13"

      - name: Download pinned reviewed Apple artifact
        shell: pwsh
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path proof-input | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GH_READ_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/jaydumisuni/TechGuyCheckm8/actions/artifacts/$env:REVIEWED_ARTIFACT_ID/zip"
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile proof-input/reviewed-apple-tools.zip
          $actual = (Get-FileHash proof-input/reviewed-apple-tools.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:REVIEWED_ARTIFACT_SHA256) {
            throw "Reviewed Apple artifact SHA-256 mismatch."
          }
          "artifact_sha256=$actual" | Set-Content -Encoding utf8 proof-input/artifact-download.txt

      - name: Compile current exact-head authority sources
        shell: pwsh
        working-directory: private-tool
        run: >-
          python -m py_compile
          utils/tgcheckm8/active_controller.py
          utils/tgcheckm8/purple_transaction_transport.py
          utils/tgcheckm8/development_controller.py
          gui/tgcheckm8_backend_runtime.py
          modules/jailbreak/development_runner.py
          scripts/verify_tgcheckm8_control_reconciliation.py
          scripts/verify_tgcheckm8_source_gate_v8.py
          scripts/run_tgcheckm8_completion_review_v5.py
          scripts/verify_builder_preflight_v4.py

      - name: Run exact completion review v5
        id: review
        continue-on-error: true
        shell: pwsh
        working-directory: private-tool
        run: >-
          python scripts/run_tgcheckm8_completion_review_v5.py
          --root .
          --reviewed-artifact-archive ../proof-input/reviewed-apple-tools.zip

      - name: Run Builder technical preflight v4
        id: preflight
        continue-on-error: true
        shell: pwsh
        working-directory: private-tool
        run: python scripts/verify_builder_preflight_v4.py --root . --review-only

      - name: Package and encrypt private evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force secure/final | Out-Null
          if (-not (Test-Path private-tool/build_config/review)) {
            New-Item -ItemType Directory -Force private-tool/build_config/review | Out-Null
            @{ schema = "thetechguy.exact-private-proof-missing-evidence.v1"; status = "FAIL" } |
              ConvertTo-Json | Set-Content -Encoding utf8 private-tool/build_config/review/exact-private-proof-missing-evidence.json
          }
          Copy-Item exact-source-binding.txt private-tool/build_config/review/exact-source-binding.txt -Force
          Copy-Item proof-input/artifact-download.txt private-tool/build_config/review/pinned-artifact-download.txt -Force
          @{
            schema = "thetechguy.exact-private-proof-run.v1"
            source_repository = $env:TTG_PRIVATE_REPOSITORY
            source_commit = $env:TTG_PRIVATE_COMMIT
            completion_review_outcome = "${{ steps.review.outcome }}"
            builder_review_only_outcome = "${{ steps.preflight.outcome }}"
            plaintext_uploaded = $false
            generated_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -Encoding utf8 private-tool/build_config/review/exact-private-proof-run.json

          Compress-Archive -Path private-tool/build_config/review/* -DestinationPath secure/evidence.zip -Force
          $EvidenceHash = (Get-FileHash secure/evidence.zip -Algorithm SHA256).Hash.ToLowerInvariant()

          @'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAr7aq+6dD+kIDlr4MRpfn
BCW9dlblnb+Ib8XElj+kSU9UW482y3LB9aVYfPhj3uFhGYmVsjjJifJ9rnfbjjPM
DXXdIFggrUHEJFaHlMmWFAn8agls3wlYh1CyyYnTsoqD3C9WADk+U2b4wJzJMKQZ
qIqud3jCSQkmdoWHqG5WUKvXV9CjVOaF+pzo18svEbUplVnqi9bD1X91NEDanyji
61cMinwfqCeazk/9PQhLNb1vtdJDwpF74FpX2cA9hz9cQKqaWYNSvI1KowC2T27h
peZR2FLkpJP0cRJb/J3juWW6LF1faYQLKMOslbQzfUpUP+B3kkYwLxfwjRRVq+uG
xlpD3W10+FcQeWg+NceZLXtJv8P9sp6fxz8yz/wQodwXl3+GT/eUNEQizUo94SAX
o8TQuotsJj0nROumaDsY4FnsJG9s6CmFi973kTSBu7TRYb7YavjvzQZf6Uttdr8G
RBEBh2fmY/gxv9Dvg7C5Uhqt2sOxGWZElDMFIt4tJmXPAgMBAAE=
-----END PUBLIC KEY-----
'@ | Set-Content -Encoding ascii secure/evidence-public.pem

          openssl rand -out secure/aes.key 32
          $IvHex = (openssl rand -hex 16).Trim()
          $KeyHex = ([IO.File]::ReadAllBytes("secure/aes.key") | ForEach-Object { $_.ToString('x2') }) -join ''
          openssl enc -aes-256-cbc -K $KeyHex -iv $IvHex -in secure/evidence.zip -out secure/final/payload.enc
          openssl pkeyutl -encrypt -pubin -inkey secure/evidence-public.pem -in secure/aes.key -out secure/final/key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          $IvHex | Set-Content -Encoding ascii secure/final/iv.hex
          $PayloadHash = (Get-FileHash secure/final/payload.enc -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            schema = "thetechguy.encrypted-exact-private-proof.v1"
            source_repository = $env:TTG_PRIVATE_REPOSITORY
            source_commit = $env:TTG_PRIVATE_COMMIT
            evidence_zip_sha256 = $EvidenceHash
            encrypted_payload_sha256 = $PayloadHash
            algorithm = "RSA-3072 OAEP SHA-256 + AES-256-CBC"
            completion_review_outcome = "${{ steps.review.outcome }}"
            builder_review_only_outcome = "${{ steps.preflight.outcome }}"
            plaintext_uploaded = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 secure/final/manifest.json

          Remove-Item private-tool -Recurse -Force
          Remove-Item secure/evidence.zip,secure/aes.key,secure/evidence-public.pem -Force

      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-private-tool-proof-${{ github.run_id }}
          path: secure/final/**
          if-no-files-found: error
          retention-days: 3

      - name: Enforce exact proof result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.review.outcome }}" -ne "success") {
            throw "Exact completion review v5 failed. Decrypt the evidence artifact for details."
          }
          if ("${{ steps.preflight.outcome }}" -ne "success") {
            throw "Builder technical preflight v4 failed. Decrypt the evidence artifact for details."
          }
