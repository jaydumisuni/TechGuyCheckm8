name: Encrypted Private Qt Proof

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  render-private-source:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      TRANSFER_BRANCH: proof/qt-offscreen-runner-v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt proof dependencies
        shell: pwsh
        run: python -m pip install "PyQt6>=6.7,<7" "PyQt5>=5.15,<6" "qrcode[pil]>=8,<9" "requests>=2.32,<3"

      - name: Generate one-run decryption keypair
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force secure-proof | Out-Null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out secure-proof/private.pem
          openssl pkey -in secure-proof/private.pem -pubout -out secure-proof/public.pem
          @{
            schema = "thetechguy.encrypted-proof-key.v2"
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            commit = "${{ github.sha }}"
            algorithm = "RSA-3072 OAEP SHA-256 + AES-256-CBC"
          } | ConvertTo-Json | Set-Content -Encoding utf8 secure-proof/key-receipt.json

      - name: Publish encryption public key
        uses: actions/upload-artifact@v4
        with:
          name: private-proof-public-key-${{ github.run_id }}
          path: |
            secure-proof/public.pem
            secure-proof/key-receipt.json
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted source transfer
        shell: pwsh
        run: |
          $EncodedRef = [Uri]::EscapeDataString($env:TRANSFER_BRANCH)
          $ApiBase = "https://api.github.com/repos/${{ github.repository }}/contents/tools/qt-proof/private-transfer/${{ github.run_id }}"
          $Headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "THETECHGUY-private-visual-proof"
          }
          function Read-RepositoryText([string]$Name) {
            $Response = Invoke-RestMethod -Headers $Headers -Uri "$ApiBase/$Name`?ref=$EncodedRef&nonce=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
            $Encoded = ($Response.content -replace '\s', '')
            return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Encoded)).Trim()
          }
          $Ready = $false
          for ($Attempt = 1; $Attempt -le 120; $Attempt++) {
            try {
              $Builder = New-Object System.Text.StringBuilder
              $PartCount = 0
              for ($Index = 0; $Index -lt 100; $Index++) {
                $PartName = "part-$($Index.ToString('00')).b64"
                try {
                  [void]$Builder.Append((Read-RepositoryText $PartName))
                  $PartCount++
                } catch {
                  if ($Index -eq 0) { throw }
                  break
                }
              }
              if ($PartCount -lt 1) { throw "No encrypted transfer parts found." }
              [IO.File]::WriteAllBytes("secure-proof/transfer.zip", [Convert]::FromBase64String($Builder.ToString()))
              $Checksum = Read-RepositoryText "transfer.zip.sha256"
              $Expected = ($Checksum.Split(' ', [StringSplitOptions]::RemoveEmptyEntries))[0].ToLowerInvariant()
              $Actual = (Get-FileHash secure-proof/transfer.zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($Expected -eq $Actual) { $Ready = $true; break }
            } catch {
              Write-Host "Transfer attempt $Attempt not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $Ready) { throw "Encrypted source transfer did not arrive or failed SHA-256 verification." }

      - name: Decrypt private proof source
        shell: pwsh
        run: |
          Expand-Archive secure-proof/transfer.zip secure-proof/transfer -Force
          openssl pkeyutl -decrypt -inkey secure-proof/private.pem -in secure-proof/transfer/key.enc -out secure-proof/aes.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          $KeyHex = ([IO.File]::ReadAllBytes("secure-proof/aes.key") | ForEach-Object { $_.ToString('x2') }) -join ''
          $IvHex = (Get-Content secure-proof/transfer/iv.hex -Raw).Trim()
          openssl enc -d -aes-256-cbc -K $KeyHex -iv $IvHex -in secure-proof/transfer/payload.enc -out secure-proof/source.zip
          $Manifest = Get-Content secure-proof/transfer/manifest.json -Raw | ConvertFrom-Json
          $ActualSource = (Get-FileHash secure-proof/source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualSource -ne $Manifest.source_zip_sha256.ToLowerInvariant()) { throw "Decrypted source ZIP hash mismatch." }
          Expand-Archive secure-proof/source.zip secure-proof/private-source -Force

      - name: Compile transferred private proof package
        shell: pwsh
        working-directory: secure-proof/private-source
        run: |
          $Files = Get-ChildItem -Recurse -Filter *.py | ForEach-Object { $_.FullName }
          if (-not $Files) { throw "No Python proof files were transferred." }
          python -m py_compile $Files

      - name: Render private proof package
        id: render
        continue-on-error: true
        shell: pwsh
        working-directory: secure-proof/private-source
        run: |
          New-Item -ItemType Directory -Force proof-output | Out-Null
          python -m scripts.render_workspace_unification_fixture --output proof-output 2>&1 | Tee-Object -FilePath proof-output/render.log
          $Code = $LASTEXITCODE
          "exit_code=$Code" | Add-Content proof-output/render.log
          exit $Code

      - name: Create encrypted-transfer proof receipt
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force secure-proof/private-source/proof-output | Out-Null
          $TransferManifest = $null
          if (Test-Path secure-proof/transfer/manifest.json) {
            $TransferManifest = Get-Content secure-proof/transfer/manifest.json -Raw | ConvertFrom-Json
          }
          $Render = "${{ steps.render.outcome }}"
          $Status = if ($Render -eq "success") { "PASS" } else { "FAIL" }
          $Receipt = [ordered]@{
            schema = "thetechguy.encrypted-private-qt-proof.v2"
            status = $Status
            source_repository = if ($TransferManifest) { $TransferManifest.source_repository } else { $null }
            source_branch = if ($TransferManifest) { $TransferManifest.source_branch } else { $null }
            source_commit = if ($TransferManifest) { $TransferManifest.source_commit } else { $null }
            source_zip_sha256 = if ($TransferManifest) { $TransferManifest.source_zip_sha256 } else { $null }
            source_files = if ($TransferManifest) { $TransferManifest.source_files } else { @() }
            transfer_scope = if ($TransferManifest) { $TransferManifest.scope } else { $null }
            proof_repository = "${{ github.repository }}"
            proof_run_id = "${{ github.run_id }}"
            proof_commit = "${{ github.sha }}"
            qt_platform = "$env:QT_QPA_PLATFORM"
            render_outcome = $Render
            transfer_encrypted = $true
            plaintext_uploaded = $false
            generated_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $Receipt | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 secure-proof/private-source/proof-output/encrypted-transfer-receipt.json

      - name: Remove transferred plaintext before artifact upload
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force secure-proof/final-proof-output | Out-Null
          if (Test-Path secure-proof/private-source/proof-output) {
            Copy-Item secure-proof/private-source/proof-output/* secure-proof/final-proof-output -Recurse -Force
          }
          if (Test-Path secure-proof/private-source) { Remove-Item secure-proof/private-source -Recurse -Force }
          foreach ($Path in @("secure-proof/source.zip", "secure-proof/aes.key", "secure-proof/private.pem")) {
            if (Test-Path $Path) { Remove-Item $Path -Force }
          }

      - name: Upload screenshots, logs and receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-private-qt-proof-${{ github.run_id }}
          path: secure-proof/final-proof-output/**
          if-no-files-found: error
          retention-days: 14

      - name: Enforce visual proof result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.render.outcome }}" -ne "success") {
            throw "The encrypted private Qt visual proof failed. Inspect the uploaded proof logs."
          }
